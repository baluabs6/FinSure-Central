name: ci-cd
on: { push: { branches: [main] } }
env: { ACR_NAME: finsureacr }
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: mvn -B verify
      - uses: azure/login@v2
        with: { creds: "${{ secrets.AZURE_CREDENTIALS }}" }
      - run: |
          az acr login --name $ACR_NAME
          for s in claims-service policy-ai-service; do
            docker build -f $s/Dockerfile -t $ACR_NAME.azurecr.io/$s:${{ github.sha }} .
            docker push $ACR_NAME.azurecr.io/$s:${{ github.sha }}
          done
      - uses: azure/aks-set-context@v4
        with: { resource-group: finsure-rg, cluster-name: finsure-aks }
      - run: TAG=${{ github.sha }} envsubst < k8s/deployment.yaml | kubectl apply -f -
