apiVersion: apps/v1
kind: Deployment
metadata: { name: claims-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: claims-service } }
  template:
    metadata: { labels: { app: claims-service } }
    spec:
      containers:
        - name: claims-service
          image: ${ACR_NAME}.azurecr.io/claims-service:${TAG}
          ports: [{ containerPort: 8081 }]
          env: [{ name: KAFKA_BOOTSTRAP, value: kafka:9092 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 } }
---
apiVersion: v1
kind: Service
metadata: { name: claims-service }
spec: { selector: { app: claims-service }, ports: [{ port: 80, targetPort: 8081 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: policy-ai-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: policy-ai-service } }
  template:
    metadata: { labels: { app: policy-ai-service } }
    spec:
      containers:
        - name: policy-ai-service
          image: ${ACR_NAME}.azurecr.io/policy-ai-service:${TAG}
          ports: [{ containerPort: 8082 }]
          env:
            - { name: KAFKA_BOOTSTRAP, value: kafka:9092 }
            - { name: CLAIMS_URL, value: "http://claims-service" }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: anthropic, key: api-key } }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8082 } }
---
apiVersion: v1
kind: Service
metadata: { name: policy-ai-service }
spec: { selector: { app: policy-ai-service }, ports: [{ port: 80, targetPort: 8082 }] }
